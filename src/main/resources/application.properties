spring.application.name=repro-spring-jetty

# Ports for the two containers. Don't set server.port: it would be applied to both factories.
app.tomcat.port=8080
app.jetty.port=8081

# The setting under test. Registers Spring's ForwardedHeaderFilter in both containers,
# which applies X-Forwarded-Prefix as the request's context path.
server.forward-headers-strategy=framework
